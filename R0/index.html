<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Sandfall · Study Edition</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div><strong>SANDFALL</strong><small>INTERACTIVE STUDY</small></div>
        <button id="sound" aria-label="Toggle sound">♫</button>
      </header>
      <section id="stage">
        <canvas
          id="game"
          width="960"
          height="1800"
          aria-label="Color sand truck-loading puzzle"
        ></canvas>
        <div id="toast" role="status" aria-live="polite"></div>
        <div id="modal" hidden>
          <article>
            <span>✦</span>
            <h1 id="title"></h1>
            <div id="body"></div>
            <button id="action">Continue</button
            ><button id="close">Back to Game</button>
          </article>
        </div>
      </section>
      <nav>
        <button id="undo"><b>↶</b>Undo</button
        ><button id="hint"><b>✦</b>Hint</button
        ><button id="restart"><b>↻</b>Restart</button
        ><button id="levels"><b>▦</b>Levels</button
        ><button id="pause"><b>Ⅱ</b>Pause</button>
      </nav>
      <footer>
        Tap a truck · Match sand colors · Exit left, return right after 1s
      </footer>
    </main>
    <script src="js/levels.js"></script>
    <script src="js/art.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sand.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
